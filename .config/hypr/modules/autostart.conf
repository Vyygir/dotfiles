exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = hypridle
exec-once = goxlr-daemon
exec-once = hyprpm reload -n
exec-once = qs -c noctalia-shell --no-duplicate

# God damn it, GTK, just be normal
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Manually start xdg-desktop-portal because runit
exec-once = dbus-update-activation-environment --all DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR
exec-once = ~/.config/hypr/scripts/xdg-portal.sh
