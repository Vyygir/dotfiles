###
# LSPS
###

# [language-server.phpactor]
# command = "phpactor"
# args = [ "language-server" ]

[language-server.phpantom]
command = "phpantom_lsp"

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.zls]
command = "zls"

[language-server.clangd]
command = "clangd"

###
# Programming
###

[[language]]
name = "rust"
scope = "source.rust"
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "zig"
scope = "source.zig"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["zls"]

[[language]]
name = "cpp"
indent = { tab-width = 4, unit = "\t" }
language-servers = [ "clangd" ]

[[language]]
name = "php"
scope = "source.php"
indent = { tab-width = 4, unit = "\t" }
language-servers = [ "phpantom" ]

[[language]]
name = "typescript"
scope = "source.ts"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["typescript-language-server", "tailwindcss-ls", { name = "oxlint", only-features = ["diagnostics"] }]
formatter = { command = "oxfmt", args = ["--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true

[[language]]
name = "javascript"
scope = "source.js"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["typescript-language-server", "tailwindcss-ls", { name = "oxlint", only-features = ["diagnostics"] }]
formatter = { command = "oxfmt", args = ["--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true

###
# Web-specific
###

[[language]]
name = "jsx"
scope = "source.jsx"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["typescript-language-server", "tailwindcss-ls", { name = "oxlint", only-features = ["diagnostics"] }]
formatter = { command = "oxfmt", args = ["--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true

[[language]]
name = "tsx"
scope = "source.tsx"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["typescript-language-server", "tailwindcss-ls", { name = "oxlint", only-features = ["diagnostics"] }]
formatter = { command = "oxfmt", args = ["--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true
[[language]]
name = "astro"
scope = "source.astro"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["astro-ls", "tailwindcss-ls"]
auto-format = false

[[language]]
name = "css"
scope = "source.css"
file-types = ["css"]
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "scss"
scope = "source.scss"
file-types = ["scss"]
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "sass"
scope = "source.sass"
file-types = ["sass"]
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "html"
scope = "text.html.basic"
file-types = ["html", "htm"]
indent = { tab-width = 4, unit = "\t" }
language-servers = ["tailwindcss-ls"]

###
# Data Languages
###
 
[[language]]
name = "markdown"
scope = "source.md"
file-types = ["md", "markdown"]
indent = { tab-width = 4, unit = "\t" }
soft-wrap.enable = true

[[language]]
name = "json"
scope = "source.json"
file-types = ["json"]
indent = { tab-width = 4, unit = "\t" }
formatter = { command = "jq", args = ["--tab", "."] }

[[language]]
name = "xml"
scope = "text.xml"
file-types = ["xml"]
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "yaml"
scope = "source.yaml"
file-types = ["yml"]
indent = { tab-width = 2, unit = " " }
