<?xml version="1.0"?>
<fontconfig>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Google Sans</family>
			<family>Noto Sans</family><!-- extra space fallback -->
			<!--<family>IBM Plex Sans</family>-->
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<!--<family>IBM Plex Mono</family>-->
			<!--<family>VictorMono</family>-->
			<family>JetBrainsMonoNerdFont</family>
			<!--<family>Commit Mono</family>-->
		</prefer>
	</alias>
</fontconfig>
