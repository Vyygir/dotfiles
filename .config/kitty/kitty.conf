font_family      JetBrainsMono NF Light
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Medium Italic

font_size 11.0

adjust_line_height 2
modify_font baseline 0

background_opacity 0.5
dynamic_background_opacity yes

window_border_width 0
window_margin_width 6
window_padding_width 6

draw_minimal_borders yes
hide_window_decorations yes
placement_strategy center
resize_in_steps yes

allow_remote_control yes

cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0

# Custom mappings
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+up no_op    # Re-bind this to something else for window support
map ctrl+shift+down no_op  # Re-bind this to something else for window support

map ctrl+shift+[ next_tab
map ctrl+shift+] previous_tab

map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down

# BEGIN_KITTY_THEME
# Seti
include current-theme.conf
# END_KITTY_THEME

